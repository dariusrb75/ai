[versions]
agp = "8.7.3"
kotlin = "2.0.21"
nanohttpd = "2.3.1"
gson = "2.11.0"
zxing = "3.5.3"
androidxCore = "1.13.1"
androidxAppcompat = "1.7.0"
junit = "4.13.2"

[libraries]
# Embedded HTTP + WebSocket server. Plain blocking java.net sockets: no coroutines, no
# desugaring, nothing that behaves differently on Android than on the JVM. Chosen over Ktor
# precisely because "must not fail in the woods" beats "more modern".
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
nanohttpd-websocket = { module = "org.nanohttpd:nanohttpd-websocket", version.ref = "nanohttpd" }

# JSON. Works identically on the JVM and on Android, unlike org.json which Android ships
# its own conflicting copy of.
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# QR code generation for the join URL, so the iPhone scans instead of typing an IP.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
